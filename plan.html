<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#061527">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="案件">
<title>案件プランニング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:      #061527;
    --ink-1:    #0B2038;
    --ink-2:    #112B49;
    --line:     #17334F;
    --line-soft:#102743;

    --fg:       #EAF1F9;
    --fg-2:     #92A9C4;
    --fg-3:     #5D7593;

    --azure:    #58A6FF;
    --ember:    #FF8A5C;
    --mint:     #4FD1A5;

    --tap: 44px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--ink); }

  body {
    font-family: 'Zen Kaku Gothic New', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--ink); color: var(--fg);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    font-feature-settings: "palt" 1;
  }

  button, input, select { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--azure); outline-offset: 2px; border-radius: 3px; }

  .wrap { max-width: 520px; margin: 0 auto; padding: 0 20px calc(56px + env(safe-area-inset-bottom)); }

  /* ── ヘッダー ─────────────────────── */
  .top {
    position: sticky; top: 0; z-index: 10;
    background: rgba(6,21,39,0.86);
    backdrop-filter: saturate(160%) blur(14px);
    -webkit-backdrop-filter: saturate(160%) blur(14px);
    border-bottom: 1px solid var(--line-soft);
    padding-top: env(safe-area-inset-top);
  }
  .top-inner {
    max-width: 520px; margin: 0 auto; padding: 18px 20px 16px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
  }
  .title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .top-actions { display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--fg-3); white-space: nowrap; }
  .linkish { background: none; border: none; padding: 4px 0; font-size: 12px; color: var(--fg-2); cursor: pointer; }
  .linkish:hover { color: var(--fg); }
  .linkish:disabled { color: var(--fg-3); cursor: default; }

  /* ── 進捗グループ ─────────────────── */
  .stage { margin-top: 28px; }
  .stage-label {
    display: flex; align-items: center; gap: 10px; margin-bottom: 2px;
    font-size: 12px; font-weight: 700; color: var(--fg-2);
  }
  .stage-label::after { content: ''; flex: 1; height: 1px; background: var(--line-soft); }

  /* ── 案件 ─────────────────────────── */
  .proj { padding: 16px 0 14px; border-bottom: 1px solid var(--line-soft); }

  .proj-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  }
  .proj-name { font-size: 15px; font-weight: 700; line-height: 1.45; word-break: break-word; }

  .next {
    flex-shrink: 0; font-size: 12px; color: var(--fg-2);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .next .cap { color: var(--fg-3); margin-right: 4px; }
  .next[data-u="overdue"] { color: var(--ember); font-weight: 500; }
  .next[data-u="today"] { color: var(--azure); font-weight: 500; }
  .next[data-u="none"] { color: var(--ember); }

  /* ── タスク ───────────────────────── */
  .tasks { margin-top: 9px; }

  .task { display: flex; align-items: flex-start; gap: 9px; padding: 5px 0; font-size: 13px; }
  .task.leaving { opacity: 0; transform: translateX(14px); transition: opacity .2s, transform .2s; }

  .tick {
    flex-shrink: 0; position: relative;
    width: 16px; height: 16px; margin-top: 3px;
    background: none; border: 1.5px solid var(--fg-3); border-radius: 50%;
    cursor: pointer; transition: border-color .15s, background .15s;
  }
  .tick:hover { border-color: var(--mint); }
  .tick.on { background: var(--mint); border-color: var(--mint); }
  .tick.on::after {
    content: ''; position: absolute; left: 4.5px; top: 1.5px;
    width: 3.5px; height: 8px;
    border: solid var(--ink); border-width: 0 2px 2px 0; transform: rotate(43deg);
  }

  .task-main { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  /* タスク名は編集を開くタップ領域も兼ねる */
  .task-name {
    line-height: 1.5; color: var(--fg-2); word-break: break-word;
    background: none; border: none; padding: 0; text-align: left;
    font: inherit; cursor: pointer;
  }
  .task-name:hover { color: var(--fg); }
  .task-when { font-size: 11px; color: var(--fg-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .task-when[data-u="overdue"] { color: var(--ember); }
  .task-when[data-u="today"] { color: var(--azure); }
  .task-when .cap { margin-right: 2px; }

  .no-task { margin-top: 9px; font-size: 12px; color: var(--ember); }

  /* ── 追加 / 編集 ──────────────────── */
  .add-open {
    margin-top: 10px; padding: 5px 0;
    background: none; border: none;
    font-size: 12px; color: var(--fg-3); cursor: pointer;
  }
  .add-open:hover { color: var(--azure); }

  .add { margin-top: 11px; padding: 14px; background: var(--ink-1); border-radius: 9px; }
  .add input[type="text"] {
    width: 100%; height: var(--tap); padding: 0 12px; margin-bottom: 9px;
    font-size: 14px; color: var(--fg);
    background: var(--ink-2); border: 1px solid var(--line); border-radius: 7px; outline: none;
  }
  .add input[type="text"]:focus { border-color: var(--azure); }
  .add input[type="text"]::placeholder { color: var(--fg-3); }

  .add-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .add-cell { flex: 1; min-width: 0; }
  .add-cell label { display: block; font-size: 11px; color: var(--fg-3); margin-bottom: 4px; }
  .add-cell input {
    width: 100%; height: 38px; padding: 0 8px;
    font-size: 13px; color: var(--fg);
    background: var(--ink-2); border: 1px solid var(--line); border-radius: 7px; outline: none;
  }
  .add-cell input:focus { border-color: var(--azure); }

  .add-cell select.add-select {
    width: 100%; height: 38px; padding: 0 8px;
    font-size: 13px; color: var(--fg);
    background: var(--ink-2); border: 1px solid var(--line); border-radius: 7px; outline: none;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%2392A9C4' stroke-width='1.5' fill='none'/></svg>");
    background-repeat: no-repeat;
    background-position: right 8px center;
    padding-right: 24px;
  }
  .add-cell select.add-select:focus { border-color: var(--azure); }

  .add-actions { display: flex; gap: 8px; align-items: center; }
  .add-go {
    flex: 1; height: var(--tap);
    font-size: 14px; font-weight: 700; color: var(--ink);
    background: var(--azure); border: none; border-radius: 7px; cursor: pointer;
  }
  .add-go:hover { filter: brightness(1.08); }
  .add-go:disabled { background: var(--fg-3); cursor: default; }
  .add-cancel {
    height: var(--tap); padding: 0 16px;
    font-size: 13px; color: var(--fg-2);
    background: none; border: 1px solid var(--line); border-radius: 7px; cursor: pointer;
  }
  /* 編集モード時のみ表示する削除ボタン。誤タップを避けるため左端に離して配置。 */
  .add-delete {
    height: var(--tap); padding: 0 12px;
    font-size: 12px; color: var(--ember);
    background: none; border: 1px solid var(--line); border-radius: 7px; cursor: pointer;
    margin-right: auto;
  }
  .add-delete:hover { border-color: var(--ember); }

  /* ── 空・設定・通知 ───────────────── */
  .empty { padding: 60px 8px; font-size: 14px; line-height: 2; color: var(--fg-3); }
  .empty b { display: block; color: var(--fg-2); font-weight: 500; margin-bottom: 4px; }

  .panel { display: none; margin: 18px 0 4px; padding: 20px; background: var(--ink-1); border: 1px solid var(--line-soft); border-radius: 10px; }
  .panel.open { display: block; }
  .panel h2 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .panel p { font-size: 12px; line-height: 1.85; color: var(--fg-3); margin-bottom: 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--fg-2); margin-bottom: 6px; }
  .field input {
    width: 100%; height: var(--tap); padding: 0 12px;
    font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--fg); background: var(--ink-2);
    border: 1px solid var(--line); border-radius: 7px; outline: none;
  }
  .field input:focus { border-color: var(--azure); }
  .field select {
    width: 100%; height: var(--tap); padding: 0 10px;
    font-size: 14px; color: var(--fg);
    background: var(--ink-2); border: 1px solid var(--line);
    border-radius: 7px; outline: none;
  }
  .field select:focus { border-color: var(--azure); }
  .hint { margin-top: 7px; font-size: 11px; line-height: 1.7; color: var(--fg-3); }
  .save {
    height: var(--tap); padding: 0 22px;
    font-size: 14px; font-weight: 700; color: var(--ink);
    background: var(--azure); border: none; border-radius: 7px; cursor: pointer;
  }

  .toast {
    position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom));
    transform: translate(-50%, 12px);
    max-width: min(420px, calc(100vw - 40px));
    padding: 13px 20px; font-size: 13px; line-height: 1.6;
    color: var(--ink); background: var(--fg); border-radius: 9px;
    opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.bad { background: var(--ember); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="top">
  <div class="top-inner">
    <div class="title">案件</div>
    <div class="top-actions">
      <span id="sync">読み込み中</span>
      <button class="linkish" id="refresh" onclick="refresh()">更新</button>
      <button class="linkish" onclick="togglePanel()">設定</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="panel" id="panel">
    <h2>データベースの接続</h2>
    <p>登録アプリと同じIDです。ホーム画面のアイコンから起動した場合は、この画面で改めて入力してください。</p>
    <div class="field">
      <label for="cfg-task">タスクDB ID</label>
      <input id="cfg-task" type="text" inputmode="latin" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="cfg-proj">プロジェクトDB ID</label>
      <input id="cfg-proj" type="text" inputmode="latin" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="cfg-stage">区分けに使う列</label>
      <select id="cfg-stage" onchange="setStageProp(this.value)"></select>
      <div class="hint" id="stage-hint"></div>
    </div>
    <div class="field">
      <label for="cfg-tstatus">タスクの完了に使う列</label>
      <select id="cfg-tstatus" onchange="setTsProp(this.value)"></select>
      <div class="hint" id="tstatus-hint"></div>
    </div>
    <button class="save" onclick="saveConfig()">保存して読み込む</button>
  </div>

  <div id="list"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══ 設定 ══════════════════════════════
const CONFIG = {
  workerUrl: 'https://notion-proxy.h-miura.workers.dev',
  taskDb: localStorage.getItem('notion_task_db') || '',
  projDb: localStorage.getItem('notion_proj_db') || '',
};

// Notion側のプロパティ名
const P_ACCEPTED = '受任案件';     // プロジェクト：チェックボックス
const P_PSTATUS  = 'ステータス';   // プロジェクト：完了を除外する用
const P_STAGE_DEFAULT = '進捗';    // 区分けに使う列の初期候補（設定画面で変更できる）
const P_NEXT     = '次回期日';     // プロジェクト：日付
const P_RUN      = '実行日時';     // タスク（保持はするが、このアプリでは触らない）
const P_LIMIT    = '本当の期限';   // タスク

// 追加プロパティ（タスク）
const P_TYPE     = '種別';         // タスク：重量級／連絡系
const P_MINUTES  = '目安時間';     // タスク：目安時間
const P_TARGET   = '相手';         // タスク：連絡相手

// 目安時間のデフォルト値（未入力時）
const DEFAULT_MINUTES = '10分';

// 完了判定に使う列は設定画面で選ぶ（初期候補は「ステータス1」に近い名前）

// 案件の並び順。ここに無い値は、この後ろにNotionの定義順で続く。
const STAGE_ORDER = ['法律相談中', '交渉', '調停', '訴訟', 'Aria'];

const DONE_WORDS = ['完了', '済', 'done', 'complete', 'completed', 'closed', '終了'];
// 案件一覧から隠すステータス
const HIDE_WORDS = [...DONE_WORDS, 'キャンセル', '中止', '取下', '取り下げ'];
const NEW_STATUS = '未着手';
const TZ = '+09:00';

const CACHE_KEY = 'notion_plan_cache_v3';
const MAX_PAGES = 5;

let projects = [];
let tasks = [];
let stageCandidates = [];   // プロジェクトDBにある選択肢型の列
let tsCandidates = [];      // タスクDBにある、完了判定に使えそうな列
let tsProp = localStorage.getItem('notion_task_status_prop') || '';
let relProp = null;         // タスクDB側の「プロジェクト」列
let stageProp = localStorage.getItem('notion_stage_prop') || '';
let stageOrder = [];        // 選んだ列の選択肢を、Notionの定義順で保持する
let taskSchema = null;
let addFor = null;          // 追加フォームを開いている案件ID
let editFor = null;         // 編集フォームを開いているタスクID
let fetchedAt = null;
let loading = false;

// ══ 通信 ══════════════════════════════
async function notionRequest(path, method, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch(CONFIG.workerUrl + path, opts);
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `HTTP ${res.status}`);
  }
  return res.json();
}

async function queryDb(dbId) {
  let out = [], cursor;
  for (let i = 0; i < MAX_PAGES; i++) {
    const body = { page_size: 100 };
    if (cursor) body.start_cursor = cursor;
    const res = await notionRequest(`/v1/databases/${dbId}/query`, 'POST', body);
    out = out.concat(res.results || []);
    if (!res.has_more) break;
    cursor = res.next_cursor;
  }
  return out;
}

// ══ 読み込み ══════════════════════════
async function refresh() {
  if (loading) return;
  if (!CONFIG.taskDb || !CONFIG.projDb) {
    toast('DB IDが未設定です。設定から入力してください', true);
    if (!document.getElementById('panel').classList.contains('open')) togglePanel();
    return;
  }

  loading = true;
  document.getElementById('refresh').disabled = true;
  updateSync();

  try {
    // 区分けに使える列と、その選択肢の並び順をDBの定義から取る。
    const projSchema = await notionRequest(`/v1/databases/${CONFIG.projDb}`, 'GET');
    stageCandidates = candidatesOf(projSchema.properties || {});
    resolveStageProp();
    taskSchema = (await notionRequest(`/v1/databases/${CONFIG.taskDb}`, 'GET')).properties || {};
    tsCandidates = taskCandidatesOf(taskSchema);
    resolveTsProp();
    resolveRelProp();

    const [projPages, taskPages] = await Promise.all([
      queryDb(CONFIG.projDb),
      queryDb(CONFIG.taskDb),
    ]);

    projects = projPages.map(toProject);
    tasks = taskPages.map(toTask);

    fetchedAt = Date.now();
    save();
    renderStageSelect();
    renderTsSelect();
    render();
  } catch (e) {
    toast('読み込めませんでした。' + e.message, true);
  }

  loading = false;
  document.getElementById('refresh').disabled = false;
  updateSync();
}

function optionsOf(prop) {
  if (!prop) return [];
  const o = prop.type === 'status' ? prop.status?.options
          : prop.type === 'select' ? prop.select?.options
          : prop.type === 'multi_select' ? prop.multi_select?.options : null;
  return (o || []).map(x => x.name);
}

// 区分けに使える列＝選択肢を持つ列。ステータス列（完了の判定用）は除く。
function candidatesOf(props) {
  const out = [];
  for (const k in props) {
    const t = props[k].type;
    if (k === P_PSTATUS) continue;
    if (t === 'status' || t === 'select' || t === 'multi_select') {
      out.push({ name: k, type: t, options: optionsOf(props[k]) });
    }
  }
  return out;
}

function resolveStageProp() {
  const has = n => stageCandidates.some(c => c.name === n);
  if (!has(stageProp)) {
    stageProp = has(P_STAGE_DEFAULT) ? P_STAGE_DEFAULT : (stageCandidates[0]?.name || '');
  }
  stageOrder = stageCandidates.find(c => c.name === stageProp)?.options || [];
}

// ══ 変換 ══════════════════════════════
function titleOf(page) {
  const props = page.properties || {};
  for (const k in props) {
    if (props[k]?.type === 'title') return (props[k].title || []).map(t => t.plain_text).join('');
  }
  return '';
}

function dateOf(props, name) {
  const p = props[name];
  return (p && p.type === 'date' && p.date?.start) ? p.date.start : null;
}

function pickName(props, name) {
  const p = props[name];
  if (!p) return '';
  if (p.type === 'status') return p.status?.name || '';
  if (p.type === 'select') return p.select?.name || '';
  if (p.type === 'multi_select') return p.multi_select?.[0]?.name || '';
  return '';
}

function isDoneValue(v) {
  const s = String(v).toLowerCase();
  return !!v && DONE_WORDS.some(w => s.includes(w));
}

function isHiddenValue(v) {
  const s = String(v).toLowerCase();
  return !!v && HIDE_WORDS.some(w => s.includes(w));
}

// 全角数字・空白を吸収して名前を比べられるようにする
function normName(s) {
  return String(s).replace(/[\s\u3000]/g, '')
                  .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
}

// タスクDBの、完了判定に使える列（選択肢型とチェックボックス）
function taskCandidatesOf(props) {
  const out = [];
  for (const k in (props || {})) {
    const t = props[k].type;
    if (t === 'status' || t === 'select' || t === 'multi_select' || t === 'checkbox') {
      out.push({ name: k, type: t, options: optionsOf(props[k]) });
    }
  }
  return out;
}

// タスクDBのリレーション列のうち、プロジェクトDBを参照しているものを選ぶ。
// 名前ではなく参照先で判断するので、関連づけの列が複数あっても取り違えない。
function resolveRelProp() {
  const want = (CONFIG.projDb || '').replace(/-/g, '');
  let byId = null, byName = null, first = null;

  for (const k in (taskSchema || {})) {
    if (taskSchema[k].type !== 'relation') continue;
    if (!first) first = k;
    const dbid = (taskSchema[k].relation?.database_id || '').replace(/-/g, '');
    if (want && dbid === want) byId = byId || k;
    if (k === 'プロジェクト') byName = byName || k;
  }
  relProp = byId || byName || first || null;
}

function resolveTsProp() {
  const has = n => tsCandidates.some(c => c.name === n);
  if (!has(tsProp)) {
    const exact  = tsCandidates.find(c => normName(c.name) === 'ステータス1');
    const prefix = tsCandidates.find(c => normName(c.name).startsWith('ステータス'));
    tsProp = (exact || prefix || tsCandidates[0])?.name || '';
  }
}

// その列の選択肢から、条件に合うものを選ぶ（選択肢に無い値を送るとエラーになるため）
function statusOption(name, wanted, useDone) {
  const opts = optionsOf(taskSchema?.[name]);
  if (!opts.length) return wanted;
  if (opts.includes(wanted)) return wanted;
  const hit = opts.find(o => useDone ? isDoneValue(o) : !isDoneValue(o));
  return hit || opts[0];
}

// Select系プロパティの型に合わせた値を作る
// 選択肢に無い値を送るとNotionがエラーを返すので、statusOption経由で安全化
function selectValue(propName, value) {
  const schema = taskSchema[propName];
  if (!schema) return null;
  const safe = statusOption(propName, value, false);
  if (schema.type === 'status') return { status: { name: safe } };
  if (schema.type === 'select') return { select: { name: safe } };
  if (schema.type === 'multi_select') return { multi_select: [{ name: safe }] };
  return null;
}

// Select列の値をクリアする（"—"を選んだとき用）
function clearSelectValue(propName) {
  const schema = taskSchema[propName];
  if (!schema) return null;
  if (schema.type === 'status') return { status: null };
  if (schema.type === 'select') return { select: null };
  if (schema.type === 'multi_select') return { multi_select: [] };
  return null;
}

function toProject(page) {
  const props = page.properties || {};
  // 区分け候補の列はすべて控えておく。設定で切り替えても取り直さずに済む。
  const stages = {};
  stageCandidates.forEach(c => { stages[c.name] = pickName(props, c.name); });

  return {
    id: page.id,
    name: titleOf(page) || '（名称なし）',
    accepted: props[P_ACCEPTED]?.type === 'checkbox' ? !!props[P_ACCEPTED].checkbox : false,
    status: pickName(props, P_PSTATUS),
    stages,
    next: dateOf(props, P_NEXT),
  };
}

function toTask(page) {
  const props = page.properties || {};
  // 案件の紐づけは、参照先で特定した列から読む
  let projIds = [];
  if (relProp && props[relProp]?.type === 'relation') {
    projIds = (props[relProp].relation || []).map(r => r.id);
  } else {
    for (const k in props) {
      if (props[k]?.type === 'relation' && (props[k].relation || []).length) {
        projIds = props[k].relation.map(r => r.id);
        break;
      }
    }
  }
  // 完了判定は、設定で選ばれた列で行う
  let doneProp = null, doneType = null, done = false;
  const sp = tsProp ? props[tsProp] : null;
  if (sp) {
    doneProp = tsProp; doneType = sp.type;
    if (sp.type === 'checkbox') done = !!sp.checkbox;
    else if (sp.type === 'multi_select') done = (sp.multi_select || []).some(o => isDoneValue(o.name));
    else done = isDoneValue(sp[sp.type]?.name || '');
  }

  return {
    id: page.id,
    name: titleOf(page) || '（無題）',
    run: dateOf(props, P_RUN),      // 保持はするが、このアプリでは表示・編集しない
    limit: dateOf(props, P_LIMIT),
    projIds, done, doneProp, doneType,
    // 後の処理（ダッシュボード等）で使えるよう保持
    type: pickName(props, P_TYPE),
    minutes: pickName(props, P_MINUTES),
    target: pickName(props, P_TARGET),
  };
}

// ══ 日付 ══════════════════════════════
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function hasTime(s) { return !!s && s.length > 10 && s.includes('T'); }
function daysOut(s) {
  if (!s) return null;
  return Math.round((new Date(s.slice(0,10)+'T00:00:00') - new Date(todayStr()+'T00:00:00')) / 86400000);
}
function urgency(s) {
  const n = daysOut(s);
  if (n === null) return 'none';
  if (n < 0) return 'overdue';
  if (n === 0) return 'today';
  return 'later';
}
function md(s) { return `${Number(s.slice(5,7))}/${Number(s.slice(8,10))}`; }
function hm(s) { const d = new Date(s); return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`; }
function dateText(s) {
  if (!s) return '';
  const n = daysOut(s);
  const t = hasTime(s) ? ' ' + hm(s) : '';
  if (n === 0) return '今日' + t;
  if (n === 1) return '明日' + t;
  if (n < 0) return `${md(s)}${t}・${-n}日前`;
  return md(s) + t;
}

// ══ 組み立て ══════════════════════════
function tasksOf(projId) {
  // 実行日時での並び替えはやめ、期限順（未設定は後ろ）で表示する。
  // 実行日時はUI上で扱わないので、並びの根拠に使うと直感と合わなくなる。
  return tasks.filter(t => !t.done && t.projIds.includes(projId)).sort((a, b) => {
    if (!a.limit !== !b.limit) return a.limit ? -1 : 1;
    return (a.limit || '').localeCompare(b.limit || '');
  });
}

function activeProjects() {
  return projects.filter(p => p.accepted && !isHiddenValue(p.status));
}

// 案件名のあいうえお順
function byName(a, b) { return a.name.localeCompare(b.name, 'ja'); }

function stageOf(p) { return (p.stages || {})[stageProp] || ''; }

// 指定の順を最優先し、次にNotionの定義順、最後に残りを並べる
function orderedStages(seen) {
  const out = [];
  const push = s => { if (seen.has(s) && !out.includes(s)) out.push(s); };
  STAGE_ORDER.forEach(push);
  stageOrder.forEach(push);
  [...seen].forEach(push);
  return out;
}

function stageGroups() {
  const list = activeProjects();
  const seen = new Set(list.map(stageOf).filter(Boolean));
  const groups = orderedStages(seen).map(s => ({
    label: s, items: list.filter(p => stageOf(p) === s).sort(byName),
  }));
  const blank = list.filter(p => !stageOf(p)).sort(byName);
  if (blank.length) groups.push({ label: '未設定', items: blank });
  return groups.filter(g => g.items.length);
}

// ══ 表示 ══════════════════════════════
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  const el = document.getElementById('list');

  if (!CONFIG.taskDb || !CONFIG.projDb) {
    el.innerHTML = `<div class="empty"><b>まだ接続されていません</b>右上の設定から、2つのデータベースIDを入力してください。</div>`;
    return;
  }

  const groups = stageGroups();
  if (!groups.length) {
    el.innerHTML = `<div class="empty"><b>対象の案件がありません</b>「受任案件」にチェックが入り、ステータスが完了でないものが並びます。</div>`;
    return;
  }

  el.innerHTML = groups.map(g => `
    <section class="stage">
      <div class="stage-label">${esc(g.label)}</div>
      ${g.items.map(projHtml).join('')}
    </section>`).join('');
}

function projHtml(p) {
  const ts = tasksOf(p.id);
  const u = p.next ? urgency(p.next) : 'none';
  const nextLabel = p.next ? dateText(p.next) : '未設定';

  const taskRows = ts.length
    ? `<div class="tasks">${ts.map(t => taskHtml(p, t)).join('')}</div>`
    : `<div class="no-task">未完了のタスクがありません</div>`;

  return `<div class="proj" id="p-${p.id}">
    <div class="proj-head">
      <div class="proj-name">${esc(p.name)}</div>
      <div class="next" data-u="${u}"><span class="cap">次回</span>${esc(nextLabel)}</div>
    </div>
    ${taskRows}
    ${addFor === p.id ? addHtml(p) : `<button class="add-open" onclick="openAdd('${p.id}')">＋ タスクを追加</button>`}
  </div>`;
}

function taskHtml(p, t) {
  // このタスクが編集モードならフォームを差し替えて描画する
  if (editFor === t.id) return editHtml(p, t);

  let name = t.name;
  if (name.startsWith(p.name + ' / ')) name = name.slice(p.name.length + 3);

  const bits = [];
  // 実行日時はプレッシャーになるので表示しない（保持はするがUIに出さない）
  if (t.limit) bits.push(`<span class="task-when" data-u="${urgency(t.limit)}"><span class="cap">期限</span>${dateText(t.limit)}</span>`);

  return `<div class="task" id="t-${t.id}">
    <button class="tick" onclick="completeTask('${t.id}')" aria-label="完了にする"></button>
    <div class="task-main">
      <button type="button" class="task-name" onclick="openEdit('${t.id}')" title="タップで編集">${esc(name)}</button>
      ${bits.join('')}
    </div>
  </div>`;
}

// タスクDBのSelect列の選択肢からドロップダウンを生成する。
// 選択肢が未読み込みの場合は空のselectを出す（Notion側でスキーマ変更されても壊れない）。
// currentValue に既存値があればそれを選択済みにする（編集時に使う）。
function selectHtml(id, propName, defaultValue, currentValue) {
  const opts = optionsOf(taskSchema?.[propName]);
  const chosen = currentValue !== undefined && currentValue !== null ? currentValue : '';
  const emptySelected = !chosen ? ' selected' : '';
  const empty = `<option value=""${emptySelected}>—</option>`;
  const items = opts.map(o => {
    let sel = '';
    if (chosen) {
      if (o === chosen) sel = ' selected';
    } else if (defaultValue && o === defaultValue) {
      sel = ' selected';
    }
    return `<option value="${esc(o)}"${sel}>${esc(o)}</option>`;
  }).join('');
  return `<select id="${id}" class="add-select">${empty}${items}</select>`;
}

function addHtml(p) {
  return `<div class="add">
    <input type="text" id="add-name" placeholder="次にやること" autocomplete="off">
    <div class="add-row">
      <div class="add-cell"><label for="add-limit">期限</label><input type="date" id="add-limit"></div>
      <div class="add-cell">
        <label for="add-minutes">目安時間</label>
        ${selectHtml('add-minutes', P_MINUTES, DEFAULT_MINUTES)}
      </div>
    </div>
    <div class="add-row">
      <div class="add-cell">
        <label for="add-type">種別</label>
        ${selectHtml('add-type', P_TYPE)}
      </div>
      <div class="add-cell">
        <label for="add-target">相手</label>
        ${selectHtml('add-target', P_TARGET)}
      </div>
    </div>
    <div class="add-actions">
      <button class="add-go" id="add-go" onclick="addTask('${p.id}')">追加</button>
      <button class="add-cancel" onclick="closeAdd()">やめる</button>
    </div>
  </div>`;
}

// 編集フォーム。追加フォームと同じ構造・同じ列で、既存値を初期表示する。
// 「実行日時」は表示しない方針なので、既存値があってもUIには出さない（保持だけ）。
function editHtml(p, t) {
  let name = t.name;
  if (name.startsWith(p.name + ' / ')) name = name.slice(p.name.length + 3);
  const limitVal = t.limit ? t.limit.slice(0, 10) : '';

  return `<div class="add">
    <input type="text" id="edit-name" placeholder="内容" autocomplete="off" value="${esc(name)}">
    <div class="add-row">
      <div class="add-cell"><label for="edit-limit">期限</label><input type="date" id="edit-limit" value="${esc(limitVal)}"></div>
      <div class="add-cell">
        <label for="edit-minutes">目安時間</label>
        ${selectHtml('edit-minutes', P_MINUTES, DEFAULT_MINUTES, t.minutes)}
      </div>
    </div>
    <div class="add-row">
      <div class="add-cell">
        <label for="edit-type">種別</label>
        ${selectHtml('edit-type', P_TYPE, null, t.type)}
      </div>
      <div class="add-cell">
        <label for="edit-target">相手</label>
        ${selectHtml('edit-target', P_TARGET, null, t.target)}
      </div>
    </div>
    <div class="add-actions">
      <button class="add-delete" onclick="deleteTask('${t.id}')" title="このタスクを削除">削除</button>
      <button class="add-go" id="edit-go" onclick="saveEdit('${t.id}','${p.id}')">保存</button>
      <button class="add-cancel" onclick="closeEdit()">やめる</button>
    </div>
  </div>`;
}

function openAdd(id) {
  addFor = id;
  editFor = null;
  render();
  const el = document.getElementById('add-name');
  if (el) { el.focus(); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
}

function closeAdd() { addFor = null; render(); }

function openEdit(id) {
  editFor = id;
  addFor = null;
  render();
  const el = document.getElementById('edit-name');
  if (el) { el.focus(); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
}

function closeEdit() { editFor = null; render(); }

// ══ 追加 ══════════════════════════════
async function addTask(projId) {
  const p = projects.find(x => x.id === projId);
  const name = document.getElementById('add-name').value.trim();
  if (!name) { toast('内容を入力してください', true); return; }

  const limit = document.getElementById('add-limit').value;

  if (!relProp) {
    toast('タスクDBに、プロジェクトDBを参照する関連づけの列が見つかりません', true);
    return;
  }

  const btn = document.getElementById('add-go');
  btn.disabled = true;
  btn.textContent = '追加中...';

  // タスクDBの実際の列構成を見て、存在する列にだけ値を入れる
  const props = {};
  for (const k in taskSchema) {
    if (taskSchema[k].type === 'title') {
      props[k] = { title: [{ text: { content: `${p.name} / ${name}` } }] };
    }
  }
  if (relProp) props[relProp] = { relation: [{ id: projId }] };
  // 実行日時はこのアプリでは扱わない（P_RUNには何も入れない）
  if (limit && taskSchema[P_LIMIT]) props[P_LIMIT] = { date: { start: limit } };
  if (tsProp && taskSchema[tsProp]) {
    const t = taskSchema[tsProp].type;
    const v = statusOption(tsProp, NEW_STATUS, false);
    if (t === 'status' || t === 'select') props[tsProp] = { [t]: { name: v } };
    else if (t === 'multi_select') props[tsProp] = { multi_select: [{ name: v }] };
    else if (t === 'checkbox') props[tsProp] = { checkbox: false };
  }

  // 追加：種別・目安時間・相手を、DBに列があれば入れる
  const type    = document.getElementById('add-type')?.value || '';
  const minutes = document.getElementById('add-minutes')?.value || DEFAULT_MINUTES;
  const target  = document.getElementById('add-target')?.value || '';

  if (type && taskSchema[P_TYPE]) {
    const v = selectValue(P_TYPE, type);
    if (v) props[P_TYPE] = v;
  }
  // 目安時間は未入力でもデフォルトが入る
  if (minutes && taskSchema[P_MINUTES]) {
    const v = selectValue(P_MINUTES, minutes);
    if (v) props[P_MINUTES] = v;
  }
  if (target && taskSchema[P_TARGET]) {
    const v = selectValue(P_TARGET, target);
    if (v) props[P_TARGET] = v;
  }

  try {
    const page = await notionRequest('/v1/pages', 'POST', {
      parent: { database_id: CONFIG.taskDb },
      properties: props,
    });
    tasks.push(toTask(page));
    addFor = null;
    save();
    render();
    toast('追加しました');
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '追加';
    toast('追加できませんでした。' + e.message, true);
  }
}

// ══ 編集（既存タスクの更新） ══════════
async function saveEdit(taskId, projId) {
  const t = tasks.find(x => x.id === taskId);
  const p = projects.find(x => x.id === projId);
  if (!t || !p) { toast('タスクが見つかりません', true); return; }

  const name = document.getElementById('edit-name').value.trim();
  if (!name) { toast('内容を入力してください', true); return; }

  const limit = document.getElementById('edit-limit').value;
  const type    = document.getElementById('edit-type')?.value || '';
  const minutes = document.getElementById('edit-minutes')?.value || '';
  const target  = document.getElementById('edit-target')?.value || '';

  const btn = document.getElementById('edit-go');
  btn.disabled = true;
  btn.textContent = '保存中...';

  // 変更するプロパティだけをまとめる。触っていない列は送らないので、
  // このアプリで扱わない実行日時などが誤って書き換わることはない。
  const props = {};
  for (const k in taskSchema) {
    if (taskSchema[k].type === 'title') {
      props[k] = { title: [{ text: { content: `${p.name} / ${name}` } }] };
    }
  }
  if (taskSchema[P_LIMIT]) {
    props[P_LIMIT] = limit ? { date: { start: limit } } : { date: null };
  }
  if (taskSchema[P_TYPE]) {
    const v = type ? selectValue(P_TYPE, type) : clearSelectValue(P_TYPE);
    if (v) props[P_TYPE] = v;
  }
  if (taskSchema[P_MINUTES]) {
    const v = minutes ? selectValue(P_MINUTES, minutes) : clearSelectValue(P_MINUTES);
    if (v) props[P_MINUTES] = v;
  }
  if (taskSchema[P_TARGET]) {
    const v = target ? selectValue(P_TARGET, target) : clearSelectValue(P_TARGET);
    if (v) props[P_TARGET] = v;
  }

  try {
    const page = await notionRequest(`/v1/pages/${taskId}`, 'PATCH', { properties: props });
    // 手元のキャッシュも書き換えて、再取得を待たずに反映する
    const idx = tasks.findIndex(x => x.id === taskId);
    if (idx >= 0) tasks[idx] = toTask(page);
    editFor = null;
    save();
    render();
    toast('保存しました');
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '保存';
    toast('保存できませんでした。' + e.message, true);
  }
}

// タスクの削除（アーカイブ）。Notion APIではページのarchive=trueで実現する。
async function deleteTask(taskId) {
  if (!confirm('このタスクを削除します。よろしいですか？')) return;
  try {
    await notionRequest(`/v1/pages/${taskId}`, 'PATCH', { archived: true });
    tasks = tasks.filter(t => t.id !== taskId);
    editFor = null;
    save();
    render();
    toast('削除しました');
  } catch (e) {
    toast('削除できませんでした。' + e.message, true);
  }
}

// ══ 完了 ══════════════════════════════
function doneValueFor(type, name) {
  if (type === 'checkbox') return { checkbox: true };
  const v = statusOption(name, '完了', true);
  if (type === 'multi_select') return { multi_select: [{ name: v }] };
  return { [type]: { name: v } };
}

async function completeTask(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  if (!t.doneProp) {
    toast('完了に使う列が決まっていません。設定から選んでください', true);
    if (!document.getElementById('panel').classList.contains('open')) togglePanel();
    return;
  }

  t.done = true;
  const row = document.getElementById('t-' + id);
  if (row) row.classList.add('leaving');
  setTimeout(render, 200);

  try {
    await notionRequest(`/v1/pages/${id}`, 'PATCH', {
      properties: { [t.doneProp]: doneValueFor(t.doneType, t.doneProp) },
    });
    save();
  } catch (e) {
    t.done = false;
    render();
    toast('反映できませんでした。' + e.message, true);
  }
}

// ══ 補助 ══════════════════════════════
function save() {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({ projects, tasks, stageCandidates, stageOrder, tsCandidates, taskSchema, at: fetchedAt }));
  } catch (e) {}
}

function updateSync() {
  const el = document.getElementById('sync');
  if (loading) { el.textContent = '更新中'; return; }
  if (!fetchedAt) { el.textContent = '未取得'; return; }
  const m = Math.floor((Date.now() - fetchedAt) / 60000);
  el.textContent = m < 1 ? 'たった今' : m < 60 ? `${m}分前` : `${Math.floor(m/60)}時間前`;
}
setInterval(updateSync, 60000);

function togglePanel() { document.getElementById('panel').classList.toggle('open'); }

function renderStageSelect() {
  const sel = document.getElementById('cfg-stage');
  const hint = document.getElementById('stage-hint');

  if (!stageCandidates.length) {
    sel.innerHTML = `<option>読み込み後に選べます</option>`;
    hint.textContent = '';
    return;
  }

  sel.innerHTML = stageCandidates.map(c =>
    `<option value="${c.name.replace(/"/g, '&quot;')}"${c.name === stageProp ? ' selected' : ''}>${c.name}</option>`
  ).join('');

  const cur = stageCandidates.find(c => c.name === stageProp);
  hint.textContent = cur && cur.options.length
    ? `選択肢: ${cur.options.join(' / ')}`
    : '選択肢が見つかりません';
}

function renderTsSelect() {
  const sel = document.getElementById('cfg-tstatus');
  const hint = document.getElementById('tstatus-hint');
  if (!sel) return;

  if (!tsCandidates.length) {
    sel.innerHTML = `<option>読み込み後に選べます</option>`;
    hint.textContent = '';
    return;
  }

  sel.innerHTML = tsCandidates.map(c =>
    `<option value="${c.name.replace(/"/g, '&quot;')}"${c.name === tsProp ? ' selected' : ''}>${c.name}</option>`
  ).join('');

  const cur = tsCandidates.find(c => c.name === tsProp);
  hint.textContent = !cur ? ''
    : cur.type === 'checkbox' ? 'チェックボックス。押すとチェックが入ります。'
    : cur.options.length ? `選択肢: ${cur.options.join(' / ')}`
    : '選択肢が見つかりません';
}

function setTsProp(name) {
  tsProp = name;
  localStorage.setItem('notion_task_status_prop', name);
  renderTsSelect();
  refresh();          // 判定基準が変わるので読み直す
}

function setStageProp(name) {
  stageProp = name;
  localStorage.setItem('notion_stage_prop', name);
  stageOrder = stageCandidates.find(c => c.name === name)?.options || [];
  renderStageSelect();
  render();
}

function saveConfig() {
  CONFIG.taskDb = document.getElementById('cfg-task').value.trim();
  CONFIG.projDb = document.getElementById('cfg-proj').value.trim();
  localStorage.setItem('notion_task_db', CONFIG.taskDb);
  localStorage.setItem('notion_proj_db', CONFIG.projDb);
  togglePanel();
  refresh();
}

let toastTimer;
function toast(msg, bad = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast' + (bad ? ' bad' : ''); }, 4000);
}

function init() {
  document.getElementById('cfg-task').value = CONFIG.taskDb;
  document.getElementById('cfg-proj').value = CONFIG.projDb;

  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if (c) {
      projects = c.projects || []; tasks = c.tasks || [];
      stageCandidates = c.stageCandidates || [];
      tsCandidates = c.tsCandidates || [];
      stageOrder = c.stageOrder || []; taskSchema = c.taskSchema || null;
      fetchedAt = c.at;
      resolveRelProp();
    }
  } catch (e) {}

  renderStageSelect();
  renderTsSelect();
  render();
  updateSync();

  if (!CONFIG.taskDb || !CONFIG.projDb) togglePanel();
  else refresh();
}

document.addEventListener('DOMContentLoaded', init);
</script>
